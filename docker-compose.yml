services:
  postgres:
    image: postgres:16-alpine
    container_name: job_market_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_market}
      POSTGRES_USER: ${POSTGRES_USER:-job_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - job_market_pgdata:/var/lib/postgresql/data

volumes:
  job_market_pgdata:
